[project]
name = "traceforge"
version = "0.1.0"
description = "Production-grade cross-agent decision provenance on Neo4j + AWS Strands + Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.40.0",
    "strands-agents[otel]",
    "bedrock-agentcore>=1.1.0",
    "neo4j>=5.20.0",
    "neo4j-agent-memory[aws,strands]>=0.4.0",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "python-dotenv",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
lambda = ["neo4j>=5.20.0", "boto3>=1.35.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100
